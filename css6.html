<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My First Styled Page</title>
  <style>
    body {
      background-color: #d6d64a;
      color: #550055;
      font-family: Georgia, serif;
      padding: 30px;
    }

    h1 {
      color: #80004d;
      font-size: 32px;
    }

    .nav {
      float: left;
      width: 150px;
      margin-right: 20px;
    }

    .nav a {
      display: block;
      width: 120px;
      background-color: white;
      color: blue;
      font-weight: bold;
      padding: 5px 10px;
      margin-bottom: 10px;
      text-decoration: none;
      border-right: 15px solid black;
    }

    .content {
      overflow: hidden;
    }

    p {
      margin-top: 0;
      max-width: 600px;
    }

    .footer {
      margin-top: 40px;
      font-style: italic;
      border-top: 1px dotted #555;
      padding-top: 10px;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>My first styled page</h1>

  <div class="nav">
    <a href="#">Home page</a>
    <a href="#">Musings</a>
    <a href="#">My town</a>
    <a href="#">Links</a>
  </div>

  <div class="content">
    <p>Welcome to my styled page!</p>
    <p>It lacks images, but at least it has style. And it has links, even if they don't go anywhere…</p>
    <p>There should be more here, but I don't know what yet.</p>

    <div class="footer">
      <p>Made 3 May 2025<br>
      by myself.</p>
    </div>
  </div>

</body>
</html>
