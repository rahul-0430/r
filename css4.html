<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hoverable Sidenav Buttons</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
        }

        .sidenav {
            height: 100%;
            width: 60px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: white;
            overflow-x: hidden;
            padding-top: 20px;
        }

        .sidenav a {
            position: absolute;
            left: -120px;
            transition: 0.3s;
            padding: 16px;
            width: 180px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            border-radius: 0 5px 5px 0;
        }

        .sidenav a:hover {
            left: 0;
        }

        #green {
            top: 20px;
            background-color: #4CAF50;
        }

        #blue {
            top: 80px;
            background-color: #2196F3;
        }

        #red {
            top: 140px;
            background-color: #f44336;
        }

        #gray {
            top: 200px;
            background-color: #555;
        }

        .main {
            margin-left: 80px;
            padding: 20px;
        }

        h2 {
            font-weight: bold;
        }

        p {
            font-size: 18px;
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>

<div class="sidenav">
    <a href="#" id="green">Green</a>
    <a href="#" id="blue">Blue</a>
    <a href="#" id="red">Red</a>
    <a href="#" id="gray">Gray</a>
</div>

<div class="main">
    <h2>Hoverable Sidenav Buttons</h2>
    <p>Hover over the buttons in the left side navigation to open them.</p>
</div>

</body>
</html>
