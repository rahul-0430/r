<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  

  <style>
    body {
      background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWOtHg5wFEUOULLR72Dxiry3QuGbeqShgkwTaIGIH6eKIDNwQJ1Q&s=10&ec=72940545');
      background-size: cover;
      background-position: center;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
    }

    h1 {
      font-size: 2.5em;
      margin-top: 50px;
      color: #ffffff;
    }

    p {
      font-size: 1.2em;
      margin-top: 20px;
      color: #ffffff;
    }

    .projects-list {
      list-style-type: none;
      padding: 0;
      margin-top: 30px;
    }

    .projects-list li {
      margin: 10px;
    }

    .projects-list li a {
      text-decoration: none;
    }

    .projects-list li a button {
      display: block;
      width: 200px;
      height: 50px;
      border-radius: 8px;
      background-color: #333;
      color: white;
      font-size: 1.5em;
      border: none;
      cursor: pointer;
      transition: transform 0.3s, background-color 0.3s;
    }

    .projects-list li a button:hover {
      transform: scale(1.05);
      background-color: #444;
    }
  </style>
</head>
<body>

  <h1>CSS Projects</h1>

  <ul class="projects-list">
    <li>
      <a href="css1.html"><button>CSS1</button></a>
    </li>
    <li>
      <a href="css2.html"><button>CSS2</button></a>
    </li>
    <li>
      <a href="css3.html"><button>CSS3</button></a>
    </li>
    <li>
      <a href="css4.html"><button>CSS4</button></a>
    </li>
    <li>
      <a href="css5.html"><button>CSS5</button></a>
    </li>
    <li>
      <a href="css6.html"><button>CSS6</button></a>
    </li>
  </ul>

</body>
</html>
