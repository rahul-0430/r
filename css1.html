<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background-color: white;
    }

    table {
      width: 60%;
      margin: 0 auto 50px;
      border-collapse: separate;
      border-spacing: 0;
      background-color: #a0d8de;
      border: 2px solid #5e9ca0;
      border-radius: 12px;
      font-family: Arial, sans-serif;
    }

    th {
      border: 2px solid #5e9ca0;
      padding: 10px 15px;
      text-align: center;
      border-radius: 12px;
      font-weight: bold;
    }

    td {
      border: 2px solid #5e9ca0;
      padding: 10px 15px;
      text-align: left;
      border-radius: 12px;
    }

    .shape-grid {
      width: 420px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-template-rows: repeat(3, 70px);
      gap: 20px;
    }

    .shape {
      border: 3px solid #9ad94a;
      width: 100%;
      height: 100%;
    }

    .rounded {
      border-radius: 15px;
    }

    .more-rounded {
      border-radius: 30px;
    }

    .no-radius {
      border-radius: 0;
    }

    .oval {
      border-radius: 50% / 50%;
    }

    .custom-diagonal {
      border-radius: 0 15px 0 15px;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th>Firstname</th>
      <th>Lastname</th>
      <th>Age</th>
    </tr>
    <tr>
      <td>Jill</td>
      <td>Smith</td>
      <td>50</td>
    </tr>
    <tr>
      <td>Eve</td>
      <td>Jackson</td>
      <td>94</td>
    </tr>
    <tr>
      <td>John</td>
      <td>Doe</td>
      <td>80</td>
    </tr>
  </table>

  <div class="shape-grid">
    <div class="shape rounded"></div>
    <div class="shape rounded"></div>
    <div class="shape more-rounded"></div>
    <div class="shape rounded"></div>
    <div class="shape no-radius"></div>
    <div class="shape more-rounded"></div>
    <div class="shape oval"></div>
    <div class="shape no-radius"></div>
    <div class="shape custom-diagonal"></div>
  </div>

</body>
</html>
