<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 1 Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }

        h1, h3 {
            font-weight: 600;
        }

        .task-btn {
            margin: 10px;
            min-width: 110px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .task-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .section-title {
            margin-top: 50px;
            margin-bottom: 20px;
            color: #343a40;
        }

        .container {
            max-width: 700px;
        }
    </style>
</head>
<body>
    <div class="container py-5 text-center">
        <h1 class="mb-4 text-primary">Week 1 Tasks</h1>

        <h3 class="section-title">HTML Tasks</h3>
        <div>
            <a href="html1.html" class="btn btn-outline-primary task-btn">HTML1</a>
            <a href="html2.html" class="btn btn-outline-primary task-btn">HTML2</a>
            <a href="html3.html" class="btn btn-outline-primary task-btn">HTML3</a>
        </div>

        <h3 class="section-title">CSS Tasks</h3>
        <div>
            <a href="css1.html" class="btn btn-outline-success task-btn">CSS1</a>
            <a href="css2.html" class="btn btn-outline-success task-btn">CSS2</a>
            <a href="css3.html" class="btn btn-outline-success task-btn">CSS3</a>
            <a href="css4.html" class="btn btn-outline-success task-btn">CSS4</a>
            <a href="css5.html" class="btn btn-outline-success task-btn">CSS5</a>
            <a href="css6.html" class="btn btn-outline-success task-btn">CSS6</a>
        </div>

        <h3 class="section-title">Bootstrap Task</h3>
        <div>
            <a href="bootstraptasks.html" class="btn btn-outline-danger task-btn">Bootstrap Task</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
