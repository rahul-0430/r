
<!DOCTYPE html>

<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      padding: 20px;
    }


.nav-wrapper {
  display: flex;
  align-items: flex-start;
}

.nav-label {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.vertical-section {
  margin-right: 40px;
}

.vertical-nav-container {
  width: 200px;
  border: 2px solid black;
}

.vertical-nav {
  display: flex;
  flex-direction: column;
}

.vertical-nav a {
  padding: 15px 20px;
  text-decoration: none;
  font-size: 18px;
  color: blue;
  background-color: lightblue;
  border-bottom: 1px solid white;
}

.vertical-nav a:first-child {
  background-color: orange;
  color: white;
  font-weight: bold;
  font-size: 20px;
}

.vertical-nav a:hover {
  background-color: lightgoldenrodyellow;
  color: black;
}

.horizontal-section {
  flex-grow: 1;
}

.horizontal-nav-container {
  display: inline-block;
  border: 2px solid black;
  background-color: lightsteelblue;
}

.horizontal-nav {
  display: flex;
}

.horizontal-nav a {
  padding: 15px 20px;
  text-decoration: none;
  font-size: 18px;
  color: blue;
  background-color: transparent;
  border-right: 1px solid white;
}

.horizontal-nav a:last-child {
  border-right: none;
}

.horizontal-nav a:first-child {
  background-color: orange;
  color: white;
  font-weight: bold;
  font-size: 20px;
}

.horizontal-nav a:hover {
  background-color: lightgoldenrodyellow;
  color: black;
}

  </style>
</head>
<body>

  <div class="nav-wrapper">
    <div class="vertical-section">
      <div class="nav-label">Vertical Navigation</div>
      <div class="vertical-nav-container">
        <div class="vertical-nav">
          <a href="#">Home</a>
          <a href="#">Java</a>
          <a href="#">CSS</a>
          <a href="#">HTML</a>
          <a href="#">Bootstrap</a>
        </div>
      </div>
    </div>


<div class="horizontal-section">
  <div class="nav-label">Horizontal Navigation</div>
  <div class="horizontal-nav-container">
    <div class="horizontal-nav">
      <a href="#">Home</a>
      <a href="#">Java</a>
      <a href="#">CSS</a>
      <a href="#">HTML</a>
      <a href="#">Bootstrap</a>
    </div>
  </div>
</div>


  </div>

</body>
</html>
